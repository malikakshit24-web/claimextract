[project]
name = "claimextract"
version = "0.1.0"
description = "Document AI for healthcare claims: extract, validate and review claim data from PDFs and scans"
readme = "README.md"
authors = [
    { name = "Akshit Malik" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "faker>=40.0.0",
    "fastapi>=0.162.0",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.10.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "reportlab>=4.4.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claimextract-generate = "claimextract.generator:main"
claimextract-evaluate = "claimextract.evaluate:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
