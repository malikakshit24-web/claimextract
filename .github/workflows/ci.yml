name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claimextract
          POSTGRES_PASSWORD: claimextract
          POSTGRES_DB: claimextract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimextract"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CLAIMEXTRACT_TEST_DATABASE_URL: postgresql+psycopg://claimextract:claimextract@localhost:5432/claimextract_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claimextract .
